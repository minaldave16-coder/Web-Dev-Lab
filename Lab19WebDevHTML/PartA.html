<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class = "container bg-info-subtle">

    <div class="container container-fluid text-center py-5">
        <div class="bg-primary text-white rounded-4 
                    d-flex align-items-center justify-content-center
                    mx-auto mb-4"
             style="width: 110px; height: 110px;">

            <span class="display-3">B</span>

        </div>
        <h1 class="fw-normal mb-4">Please sign in</h1>
        <form class="mx-auto" style="max-width: 465px;">
            <div class="mb-3">
                <input type="email"
                       class="form-control form-control-lg rounded-top mb-3"
                       placeholder="Email address">
                <input type="password"
                       class="form-control form-control-lg rounded-bottom"
                       placeholder="Password">
            </div>
            <div class="form-check d-flex justify-content-center mb-4">

                <input class="form-check-input me-2"
                       type="checkbox"
                       id="remember">

                <label class="form-check-label" for="remember">
                    Remember me
                </label>

            </div>
            <button type="submit"
                    class="btn btn-primary btn-lg w-100">
                Sign in
            </button>

        </form>
        <footer><p class = "lead">&copy; 2026-2027</p></footer>

    </div>

</body>
</html>
