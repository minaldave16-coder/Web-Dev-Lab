<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="row w-10 bg-white shadow-lg overflow-hidden" style="max-width: 1200px; height: 750px;">

            <div class="col-lg-6 p-0">

                <img src="https://i.pinimg.com/originals/7a/54/d0/7a54d0d9bb652a238d96d0dc9b7eefd8.jpg?nii=t" alt="Welcome Back" class="w-100 h-100 object-fit-cover">

            </div>

            <div class="col-lg-6 d-flex align-items-center justify-content-center">


                <div class="w-75 h-75 align-items-center">

                    <div class="text-center">

                        <h2 class="fw-bold text-primary">
                            Login Account
                        </h2>


                        <p class="text-secondary small mt-3 mb-5">

                            Lorem ipsum dolor sit amet,
                            consectetur adipiscing elit,
                            sed do eiusmod tempor incididunt
                            ut labore et dolore.

                        </p>

                    </div>

                    <div class="input-group mb-3">

                        <span class="input-group-text bg-light border-0 border-start border-primary border-4">
                        </span>

                        <input type="text" class="form-control bg-light border py-3" placeholder="Username">

                    </div>

                    <div class="input-group mb-4">

                        <span class="input-group-text bg-light border-0 border-start border-primary border-4">
                        </span>

                        <input type="password" class="form-control bg-light border-0 py-3" placeholder="Password">

                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-5">


                        <div class="form-check">

                            <input class="form-check-input" type="checkbox" id="remember">

                            <label class="form-check-label text-secondary small" for="remember">

                                Keep me signed in

                            </label>

                        </div>

                        <span class="text-info small">

                            Already a member?

                        </span>

                    </div>

                    <button type="button" class="btn btn-primary w-100 rounded-pill py-3 fw-bold">

                        SUBSCRIBE

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
