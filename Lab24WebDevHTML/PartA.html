<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <style>
        .offcanvas-body a {
            text-decoration: none;
            color: white;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>

<body class="bg-secondary-subtle">
    <div class="container bg-secondary-sub">
        <div class="row">
            <div class="col-3">
                <div class="offcanvas offcanvas-start show text-white bg-dark" data-bs-scroll="true"
                    data-bs-backdrop="false" tabindex="-1" id="sidebar">

                    <div class="offcanvas-body">

                        <a href="#"><i class="bi bi-menu-up"
                                style="margin-top: -40px; height: 25px; width: 25px;"></i></a>

                        <div class="menu">
                            <a href="#" class="d-block p-2 rounded">
                                <i class="bi bi-speedometer2 me-2"></i>
                                <h4>Dashboard</h4>
                            </a>
                            <a href="#" class="d-block p-2 rounded">
                                <i class="bi bi-file-earmark me-2"></i>
                                <h4>Projects</h4>
                            </a>
                            <a href="#" class="d-block p-2 rounded">
                                <i class="bi bi-person me-2"></i>
                                <h4>Tasks</h4>
                            </a>
                            <a href="#" class="d-block p-2 rounded">
                                <i class="bi bi-question-circle me-2"></i>
                                <h4>Team</h4>
                            </a>
                            <a href="#" class="d-block p-2 rounded">
                                <i class="bi bi-folder me-2"></i>
                                <h4>Settings</h4>
                            </a>
                        </div>

                    </div>
                </div>
            </div>
            <div class="col-9">
                <nav class="navbar bg-1 fg-2">
                    <div class="container-fluid">
                        <a class="navbar-brand">
                            <h2>Project</h2>
                        </a>
                        <form class="d-flex" role="search">
                            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                            <button class=" rounded btn-outline" type="submit"
                                style="color: white; background-color: midnightblue;">+</button>
                        </form>
                    </div>
                </nav>

                <h3>Active Projects</h3>
                <br>
                <div class="d-flex flex-wrap justify-content-center gap-3" style="margin-top: 20px;">
                    <div class="card border border-0" style="width: 18rem;">
                        <div class="card-body border border-1 text-white" style="background-color: midnightblue;">
                            <h5 class="card-title">Card title</h5>
                            <p class="card-text">
                            <h6>12 tasks</h6>
                            </p>
                            <br>
                            <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="75"
                                aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar" style="width: 75%"></div>
                            </div>
                            <br><br>
                            <p class="card-text">
                                25th March 2024</p>
                        </div>
                    </div>
                    <div class="card border border-0" style="width: 18rem;">
                        <div class="card-body" style="background-color: black; color: white;">
                            <h5 class="card-title">Card title</h5>
                            <p class="card-text">
                            <h6>April 16</h6>
                            </p>
                            <br>
                            <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="75"
                                aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar" style="width: 75%"></div>
                            </div>
                            <br><br>
                            <p class="card-text">
                                16th April</p>
                        </div>
                    </div>
                    <div class="card border border-0" style="width: 18rem;">
                        <div class="card-body" style="background-color: midnightblue; color: white;">
                            <h5 class="card-title">Card title</h5>
                            <p class="card-text">
                            <h6>75% Progress</h6>
                            </p>
                            <br>
                            <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="75"
                                aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar" style="width: 75%"></div>
                            </div>
                            <br><br>
                            <p class="card-text">
                                75%</p>
                        </div>

                    </div>
                </div><br><br>
                <div class="row">
                    <div class="col"></div>
                    <div class="col">
                        <div class="card" style="width: 18rem;">
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item">An item</li>
                                <li class="list-group-item">A second item</li>
                                <li class="list-group-item">A third item</li>
                            </ul>
                            
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
