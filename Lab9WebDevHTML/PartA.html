<html>
    <body>
        <title>HelloAnimation</title>
    </body>
    <style>
        .box{
            height:300px;
            width:300px;
            background-color: blue;
            animation-name: changeColor;
            animation-duration: 6s;
        }
        @keyframes changeColor{
            from{
                background-color: blue;
            }
            to{
                background-color: aquamarine;
            }
        }
    </style>
    <body>
        <div class = "box"></div>
    </body>
</html>
