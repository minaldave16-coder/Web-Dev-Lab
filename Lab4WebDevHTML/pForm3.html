<html>
    <head>
        <title>Third Form</title>
    </head>
    <body>
        <h1 align = "center">Employee Registration</h1>
        <table cellspacing = "10px" cellpadding = "10px" align = "center">
            <form>
                <tr>
                    <th colspan = "6">Personal Information</th>
                </tr>
                <tr>
                    <td>
                        <label for = "employee id">Employee Id</label>
                    </td>
                    <td>:</td>
                    <td><input type = "text" id = "employee id" placeholder = "Enter Employee Id"></td>
                    <td>
                        <label for = "employee name">Employee Name</label>
                    </td>
                    <td>:</td>
                    <td><input type = "text" id = "employee name" placeholder = "Enter Employee Name"></td>               
                </tr>
                <tr>
                    <td>
                        <label for = "email">Email</label>
                    </td>
                    <td>:</td>
                    <td><input type = "text" id = "email" placeholder = "Enter Email"></td>
                    <td>
                        <label for = "contact no.">Contact No</label>
                    </td>
                    <td>:</td>
                    <td><input type = "tel" id = "contact no." placeholder = "Enter Contact No."></td>
                </tr>
                <tr>
                    <td>
                    <label for = "marital status">Marital Status</label>
                    </td>
                    <td>:</td>
                    <td><input type = "radio" name = "m">Single
                    <input type = "radio" name = "m">Married</td>
                </tr>
                <tr>
                    <th colspan = "6">Education Qualification</th>
                </tr>
                <tr>
                    <td>
                        <label for = "education">Education</label>
                    </td>
                    <td>:</td>
                    <td><input type = "text" id = "education" placeholder = "Enter Education Details"></td>
                    <td>
                        <label for = "experience">Experience</label>
                    </td>
                    <td>:</td>
                    <td><input type = "text" id = "experience" placeholder = "Enter Experience Details"></td>
                </tr>
                <tr>
                    <th colspan = "6">Job Details</th>
                </tr>
                <tr>
                    <td>
                        <label for = "designation">Designation</label>
                    </td>
                    <td>:</td>
                    <td><input type = "text" id = "designation" placeholder = "Enter Designation Details"></td>
                    <td>
                        <label for = "job location">Job Location</label>
                    </td>
                    <td>:</td>
                    <td><input type = "text" id = "job location" placeholder = "Enter Job Location"></td>
                </tr>
                <tr>
                    <td>
                        <label for = "salary">Salary</label>
                    </td>
                    <td>:</td>
                    <td><input type = "text" id = "salary" placeholder = "Enter Salary details"></td>
                </tr>
                <tr>
                    <td colspan = "6" align = "center"><hr>
                    <button type="submit">Register</button>
                    </td>
                </tr>
            </form>
        </table>
    </body>
</html>
