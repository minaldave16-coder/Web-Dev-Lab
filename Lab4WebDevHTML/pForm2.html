<html>
    <head>
        <title>Second Form</title>
    </head>
    <body>
        <table cellspacing = "10px" align = "center">
            <form>
                <tr>
                    <th>Covid-19 Vaccination Registation Form</th>
                </tr>
                <tr>
                    <td>
                        <label for = "first name">First Name: </label>
                    </td>
                    <td><input type = "text" id = "first name"></td>
                </tr>
                <tr>
                    <td>
                        <label for = "last name">Last Name: </label>
                    </td>
                    <td><input type = "text" id = "last name"></td>
                </tr>
                <tr>
                    <td>
                    <label for = "adhar number">Adhar Number: </label>
                    </td>
                    <td><input type = "text" id = "adhar number"></td>
                </tr>
                <tr>
                    <td>
                    <label for = "Vaccine Name">Vaccine Name: </label>
                    </td>
                    <td>
                        <select>
                            <option disabled>Please enter the name of vaccine</option>
                            <option>vaccine A</option>
                            <option>vaccine B</option>
                            <option>vaccine C</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                    <label for = "Vaccine Center Name">Vaccine Center Name: </label>
                    </td>
                    <td>
                        <select>
                            <option disabled>Please enter the name of vaccinination center</option>
                            <option>A</option>
                            <option>B</option>
                            <option>C</option>
                            <option>D</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for = "date">Date of Dose: </label>
                    </td>
                    <td><input type = "date"></td>
                </tr>
                <tr>
                    <td>
                    <label for = "Dose number">Dose Number: </label>
                    </td>
                    <td><input type = "text" id = "Dose number"></td>
                </tr>
                <tr>
                <td colspan="2" style="text-align: center;">
                    <button type="submit">Click Me</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>
            </form>
        </table>
    </body>
</html>
