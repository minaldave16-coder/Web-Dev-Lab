<html>

<head>
    <title>First Form</title>
</head>

<body>
    <table cellspacing="10px" align="center">
        <form>
            <tr>
                <th>Student Registration</th>
            </tr>
            <tr>
                <td>
                    <label for="name">Fullname: </label>
                </td>
                <td>
                    <input type="text" id="name" placeholder="Enter your fullname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for = "email">Email: </label>
                </td>
                <td>
                    <input type="email" id = "email" placeholder = "Enter your email"> 
                </td>
            </tr>
            <tr>
                <td>
                    <label for = "mobile number">Mobile Number: </label>
                </td>
                <td>
                    <input type="tel" id = "mobile number" placeholder = "Enter your mobile number"> 
                </td>
            </tr>
            <tr>
                <td>
                    <label for = "address">Address</label>
                </td>
                <td><textarea rows="5" cols="6"> </textarea></td>
            </tr>
            <tr>
                <td>
                    <label for = "nationality">Nationality: </label>
                </td>
                <td><input type="text" id = "nationality"></td>
            </tr>
            <tr>
                <td>
                    <lable for = "date of birth">Date Of Birth</lable>
                </td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td><input type="radio" name="g">Male
                    <input type="radio" name="g">Female
                </td>
            </tr>
            <tr>
                <td>
                    <lable for = "highest degree">Highest Degree: </lable>
                </td>
                <td>
                    <select>
                        <option disabled>select Option</option>
                        <option>Btech</option>
                        <option>Diploma</option>
                        <option>Master</option>
                        <option>PhD</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for = "CPI">CPI: </label>
                </td>
                <td><input type = "text" id = "CPI"></td>
            </tr>
            <tr>
                <td>
                    <label for = "university">University: </label>
                </td>
                <td><input type = "text" id = "university"></td>
            </tr>
            <tr>
                <td>
                    <label for = "passing year">Passing Year: </label>
                </td>
                <td>
                    <select>
                        <option disabled>Select The Year: </option>
                        <option>2021-2022</option>
                        <option>2022-2023</option>
                        <option>2023-2024</option>
                        <option>2024-2025</option>
                        <option>2025-2026</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>
        </form>
    </table>
</body>

</html>
